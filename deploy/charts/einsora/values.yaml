domain: einsora.example.com
env: production

image:
  repository: ghcr.io/your-org/einsora-controlplane
  tag: "0.1.0"
  pullPolicy: IfNotPresent

webImage:
  repository: ghcr.io/your-org/einsora-web
  tag: "0.1.0"

database:
  # Secret with key DATABASE_URL, created out of band. Never put credentials in values.
  existingSecret: einsora-db

auth:
  oidcIssuer: https://auth.einsora.example.com/realms/einsora
  oidcAudience: einsora-api
  tenantClaim: einsora_tenant

cluster:
  untrustedRuntimeClass: kata-qemu-nvidia-gpu
  storageClass: einsora-block
  imagesNamespace: einsora-images
  # The region this cluster serves (ADR-0009), passed to its controller (only) as EINSORA_REGION.
  # The controller reconciles only this region's workloads. It must be listed in the catalog's
  # regions, or rendering fails. helmfile sets it from the environment file's `region`.
  region: dc-1

gateway:
  name: einsora
  namespace: einsora-gateway

api:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# One replica: reconcile passes are idempotent but not yet leader-elected (Phase 3).
controller:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

metering:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

web:
  replicas: 2
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

# Contents of deploy/catalog.yaml. helmfile passes it with --set-file catalog=...
catalog: ""
