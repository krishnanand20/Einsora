# The controller is the only component with cluster credentials, and the most powerful
# credential in the cluster (it can create pods in any namespace). Rules mirror the kind
# allowlist in controlplane/internal/cluster/kube/kube.go — keep them in sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: einsora-controller
  labels:
    {{- include "einsora.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: einsora-controller
  labels:
    {{- include "einsora.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [services, resourcequotas, persistentvolumeclaims]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [einsora-image-cloner]
    verbs: [bind]
  - apiGroups: [cdi.kubevirt.io]
    resources: [datavolumes/source]
    verbs: [create]
  - apiGroups: [kubevirt.io]
    resources: [virtualmachines]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: einsora-controller
  labels:
    {{- include "einsora.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: einsora-controller
subjects:
  - kind: ServiceAccount
    name: einsora-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: einsora-controller
  labels:
    {{- include "einsora.labels" . | nindent 4 }}
    app.kubernetes.io/name: einsora-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: einsora-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: einsora-controller
      annotations:
        checksum/catalog: {{ .Values.catalog | sha256sum }}
    spec:
      serviceAccountName: einsora-controller
      {{- include "einsora.podSecurityContext" . | nindent 6 }}
      containers:
        - name: controller
          image: {{ include "einsora.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [controller]
          env:
            {{- include "einsora.env" . | nindent 12 }}
            - name: EINSORA_REGION
              value: {{ include "einsora.region" . | quote }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          {{- include "einsora.containerSecurityContext" . | nindent 10 }}
          {{- include "einsora.catalogMount" . | nindent 10 }}
      {{- include "einsora.catalogVolume" . | nindent 6 }}
