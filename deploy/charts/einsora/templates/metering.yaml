apiVersion: apps/v1
kind: Deployment
metadata:
  name: einsora-metering
  labels:
    {{- include "einsora.labels" . | nindent 4 }}
    app.kubernetes.io/name: einsora-metering
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: einsora-metering
  template:
    metadata:
      labels:
        app.kubernetes.io/name: einsora-metering
    spec:
      automountServiceAccountToken: false
      {{- include "einsora.podSecurityContext" . | nindent 6 }}
      containers:
        - name: metering
          image: {{ include "einsora.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [metering]
          env:
            {{- include "einsora.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.metering.resources | nindent 12 }}
          {{- include "einsora.containerSecurityContext" . | nindent 10 }}
          {{- include "einsora.catalogMount" . | nindent 10 }}
      {{- include "einsora.catalogVolume" . | nindent 6 }}
