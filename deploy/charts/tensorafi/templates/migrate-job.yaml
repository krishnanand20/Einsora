# Applies embedded SQL migrations before every install/upgrade. Migrations must be
# backward compatible with the previous release (old pods keep running during rollout).
apiVersion: batch/v1
kind: Job
metadata:
  name: tensorafi-migrate
  labels:
    {{- include "tensorafi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "tensorafi.podSecurityContext" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "tensorafi.image" . }}
          args: [migrate]
          env:
            - name: TENSORAFI_ENV
              value: {{ .Values.env | quote }}
            - name: TENSORAFI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: DATABASE_URL
            - name: TENSORAFI_AUTH_MODE
              value: oidc
            - name: TENSORAFI_OIDC_ISSUER
              value: {{ .Values.auth.oidcIssuer | quote }}
            - name: TENSORAFI_CLUSTER_BACKEND
              value: kubernetes
          {{- include "tensorafi.containerSecurityContext" . | nindent 10 }}
