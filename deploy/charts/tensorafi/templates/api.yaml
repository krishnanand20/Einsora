# The API has no Kubernetes access at all (AGENTS.md rule 1): no ServiceAccount token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorafi-api
  labels:
    {{- include "tensorafi.labels" . | nindent 4 }}
    app.kubernetes.io/name: tensorafi-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tensorafi-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tensorafi-api
      annotations:
        checksum/catalog: {{ .Values.catalog | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "tensorafi.podSecurityContext" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "tensorafi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [api]
          env:
            {{- include "tensorafi.env" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "tensorafi.containerSecurityContext" . | nindent 10 }}
          {{- include "tensorafi.catalogMount" . | nindent 10 }}
      {{- include "tensorafi.catalogVolume" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: tensorafi-api
  labels:
    {{- include "tensorafi.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tensorafi-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tensorafi-api
  labels:
    {{- include "tensorafi.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https-api
  hostnames:
    - api.{{ .Values.domain }}
  rules:
    - backendRefs:
        - name: tensorafi-api
          port: 80
