{{- if .Values.metallb.addresses }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: einsora
  namespace: metallb-system
spec:
  addresses:
    {{- toYaml .Values.metallb.addresses | nindent 4 }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: einsora
  namespace: metallb-system
spec:
  ipAddressPools:
    - einsora
{{- end }}
