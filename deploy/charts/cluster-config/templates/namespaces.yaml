{{- /* Platform namespaces. tensorafi.dev/role labels are referenced by tenant NetworkPolicies. */}}
{{- $namespaces := dict "tensorafi-images" "" "tensorafi-gateway" "gateway" "tensorafi-models" "model-store" }}
{{- range $name, $role := $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: tensorafi
    {{- with $role }}
    tensorafi.dev/role: {{ . }}
    {{- end }}
{{- end }}
