{{- /* Platform namespaces. einsora.dev/role labels are referenced by tenant NetworkPolicies. */}}
{{- $namespaces := dict "einsora-images" "" "einsora-gateway" "gateway" "einsora-models" "model-store" }}
{{- range $name, $role := $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: einsora
    {{- with $role }}
    einsora.dev/role: {{ . }}
    {{- end }}
{{- end }}
