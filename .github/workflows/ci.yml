name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controlplane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: einsora
          POSTGRES_PASSWORD: einsora
          POSTGRES_DB: einsora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U einsora" --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: test (including Postgres store)
        run: go test -race ./...
        env:
          EINSORA_TEST_DATABASE_URL: postgres://einsora:einsora@localhost:5432/einsora?sslmode=disable
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: controlplane
      # The binaries carry the dashboard (make web-embed), so building them builds it too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: dashboard dependencies
        working-directory: web
        run: npm ci
      - name: cross-compile (linux/amd64, linux/arm64, darwin/arm64), with the dashboard
        working-directory: .
        run: make build-all

  # Apple Silicon Macs are first-class hosts (ADR-0013): run the Go and Python suites natively on macOS arm64.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - name: go test (darwin/arm64)
        working-directory: controlplane
        run: go vet ./... && go test ./...
      - uses: astral-sh/setup-uv@v6
      - name: ml tests (darwin/arm64)
        working-directory: ml
        run: uv sync --frozen && uv run pytest
      - name: install script (macOS's own tools)
        run: make test-packaging
      - name: Homebrew formula, built and installed from this commit
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: sh packaging/homebrew/install_test.sh

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - run: make deploy-check

  # Releases (ADR-0023): the install script, and a snapshot built from .goreleaser.yaml with the
  # release's pinned GoReleaser, so a broken release config shows up here, not when a tag is pushed.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from shellcheck-py shellcheck packaging/*.sh packaging/homebrew/*.sh
      - run: make test-packaging
      - uses: actions/setup-go@v5
        with:
          go-version-file: controlplane/go.mod
          cache-dependency-path: controlplane/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: dashboard dependencies
        working-directory: web
        run: npm ci
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=sign,sbom
      - name: the snapshot has what install.sh and the formula download
        run: |
          for f in einsora_darwin_arm64.tar.gz einsora_linux_amd64.tar.gz einsora_linux_arm64.tar.gz; do
            grep -q "  $f\$" dist/checksums.txt || { echo "::error::checksums.txt doesn't list $f"; exit 1; }
          done
          grep -Eq '  einsora-[^ ]+\.tar\.gz$' dist/checksums.txt ||
            { echo "::error::checksums.txt doesn't list the source archive"; exit 1; }

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from shellcheck-py shellcheck infra/scripts/*.sh
      # Pinned, so a new Ansible release can't turn main red on its own.
      - name: ansible collections
        working-directory: infra/ansible
        run: uvx --from ansible-core==2.22.0 ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        working-directory: infra/ansible
        run: uvx --with ansible-core==2.22.0 ansible-lint==26.10.1 --offline
      - run: uvx yamllint -c .yamllint.yaml .
