name: site

# Builds the website (site/) from the repository's docs on every change to them: a broken link fails
# the build. Cloudflare Pages publishes it to https://einsora.com from main (see site/README.md).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/site.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
